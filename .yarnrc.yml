nodeLinker: node-modules
nmMode: classic

# Copy mode avoids a reproducible Windows hardlink failure while restoring
# Expo's extensionless CLI binaries. EAS builds use the same deterministic
# lockfile and remain platform-independent.
# Remaining peer-dependency warnings come from upstream packages whose ranges
# are narrower than the SDK 57 versions Expo resolves for this app.
logFilters:
  - code: YN0060
    level: discard
  - code: YN0002
    level: discard
  - code: YN0068
    level: discard
  - code: YN0086
    level: discard
